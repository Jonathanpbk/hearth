server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA entry points must always be revalidated.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /registerSW.js {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /api/version.json {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        expires off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/pwa-update.html {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /api/pwa-update.js {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /api/pwa-update.css {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /offline.html {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /offline.css {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Cache static assets aggressively (content-hashed filenames)
    location ~* \.(js|css|png|ico|woff2|svg)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
