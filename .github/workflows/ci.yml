name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment script
        run: bash -n update.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development toolchain
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          HEARTH_BUILD_SHA: ${{ github.sha }}

      - name: Verify production security headers
        run: |
          docker build --build-arg HEARTH_BUILD_SHA="$GITHUB_SHA" -t hearth-ci .
          docker run -d --name hearth-ci -p 127.0.0.1:8080:80 hearth-ci
          trap 'docker rm -f hearth-ci' EXIT
          docker exec hearth-ci nginx -t
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          docker inspect hearth-ci --format '{{json .Config.Healthcheck.Test}}' | grep -q '/healthz'
          curl -fsS http://127.0.0.1:8080/api/version.json | tee /tmp/hearth-version
          grep -q '"schemaVersion":1' /tmp/hearth-version
          grep -q "\"commit\":\"$GITHUB_SHA\"" /tmp/hearth-version
          curl -fsSI http://127.0.0.1:8080/ | tee /tmp/hearth-headers
          grep -qi '^Content-Security-Policy:' /tmp/hearth-headers
          grep -qi '^Permissions-Policy:' /tmp/hearth-headers
          grep -qi '^Referrer-Policy: no-referrer' /tmp/hearth-headers
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/hearth-headers
          grep -qi '^X-Frame-Options: DENY' /tmp/hearth-headers
          curl -fsS http://127.0.0.1:8080/api/pwa-update.html | grep -q '/api/pwa-update.js'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
