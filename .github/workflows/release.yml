name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

      - name: Verify source
        run: |
          npm run lint
          npm test

      - name: Build release
        run: npm run build
        env:
          HEARTH_BUILD_SHA: ${{ github.sha }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Verify release container
        run: |
          docker build --build-arg HEARTH_BUILD_SHA="$GITHUB_SHA" -t hearth-release .
          docker run -d --name hearth-release -p 127.0.0.1:8080:80 hearth-release
          trap 'docker rm -f hearth-release' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/api/version.json | tee /tmp/hearth-version
          grep -q "\"release\":\"${GITHUB_REF_NAME#v}\"" /tmp/hearth-version
          grep -q "\"commit\":\"$GITHUB_SHA\"" /tmp/hearth-version

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Hearth $GITHUB_REF_NAME" \
            --generate-notes
